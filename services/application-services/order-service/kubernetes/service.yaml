apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      serviceAccountName: KUSTOMIZE_SVC_ACCOUNT_NAME
      automountServiceAccountToken: true
      containers:
        - name: order
          image: KUSTOMIZE_IMAGE
          ports:
            - containerPort: 5001
              name: "http"
          env:
            # The issuer and app client id this deployment will accept tokens
            # from. These are substituted at deploy time from the tenant's own
            # Cognito pool, so the service never has to infer them from a token.
            - name: COM_AMAZONAWS_SAAS_EKS_ISSUER
              value: "KUSTOMIZE_TOKEN_ISSUER"
            - name: COM_AMAZONAWS_SAAS_EKS_AUDIENCE
              value: "KUSTOMIZE_TOKEN_AUDIENCE"
            - name: COM_AMAZONAWS_SAAS_EKS_TENANTID
              value: "KUSTOMIZE_TENANT_ID"
            - name: COM_AMAZONAWS_SAAS_EKS_REGION
              value: "KUSTOMIZE_AWS_REGION"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5001
  type: NodePort

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
spec:
  rules:
    - host: KUSTOMIZE_API_HOST
      http:
        paths:
          - path: /KUSTOMIZE_TENANT/orders
            backend:
              service:
                name: order-service
                port:
                  number: 80
            pathType: Prefix
