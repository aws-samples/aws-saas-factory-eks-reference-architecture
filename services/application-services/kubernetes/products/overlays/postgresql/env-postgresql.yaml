# =========================================================================
# Strategic-merge patch: PostgreSQL env vars for product container (ALL tiers)
# =========================================================================
# Single overlay — used by Basic / Standard / Premium alike. Tier
# branching happens at app runtime inside ProductsService based on the
# presence of TENANT_NAME:
#
#   · TENANT_NAME empty   → Basic pool mode (basic_pool_db + RLS)
#   · TENANT_NAME present → per-tenant DB (tenant_<name>_db / user_<name>)
#
# MUST NOT include TABLE_NAME (that's dynamodb-only).
#
# Placeholder substitution source:
#   KUSTOMIZE_SHARED_DB_SESSION_ROLE_ARN
#     <- describe-stacks SharedDb output SharedDb-TenantSessionRoleArn
#        (Phase 5.6 — ProductService + ProductServiceTenantDeploy pre_build)
#   KUSTOMIZE_SHARED_DB_PROXY_ENDPOINT
#     <- describe-stacks SharedDb output SharedDb-ProxyEndpoint
#   KUSTOMIZE_SHARED_DB_CLUSTER_ENDPOINT_RESOURCE
#     <- derived at build time as
#        arn:aws:rds-db:${AWS_REGION}:${AWS_ACCOUNT}:dbuser:${PROXY_NAME}/
#        (trailing slash — runtime appends dbUser)
#   KUSTOMIZE_TENANT_NAME
#     <- Basic: empty string (triggers pool mode)
#        Standard/Premium: Tenant DynamoDB row's COMPANY_NAME
#   KUSTOMIZE_AWS_REGION, KUSTOMIZE_TENANT_TIER
#     <- already substituted by existing buildspec sed blocks
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
spec:
  template:
    spec:
      containers:
        - name: product
          env:
            - name: IAM_ARN
              value: "KUSTOMIZE_SHARED_DB_SESSION_ROLE_ARN"
            - name: PROXY_ENDPOINT
              value: "KUSTOMIZE_SHARED_DB_PROXY_ENDPOINT"
            - name: CLUSTER_ENDPOINT_RESOURCE
              value: "KUSTOMIZE_SHARED_DB_CLUSTER_ENDPOINT_RESOURCE"
            - name: TENANT_NAME
              value: "KUSTOMIZE_TENANT_NAME"
            - name: AWS_REGION
              value: "KUSTOMIZE_AWS_REGION"
            - name: TENANT_TIER
              value: "KUSTOMIZE_TENANT_TIER"
