# =========================================================================
# Product Service Kustomization — overlays/postgresql
# =========================================================================
# PostgreSQL backend overlay. The env-postgresql.yaml strategic-merge
# patch installs the canonical PostgreSQL env-var set onto the base
# Deployment's product container. Additional buildspec sed steps in
# lib/constructs/application-service.ts populate the KUSTOMIZE_SHARED_DB_*
# placeholders from SharedDbStack's CfnOutput exports before
# `kubectl apply -k`.
#
# Canonical env-var set (Requirement 6.1 / 6.2 / 6.4 / 7.4):
#   IAM_ARN                    <- SharedDb-TenantSessionRoleArn
#   PROXY_ENDPOINT             <- SharedDb-ProxyEndpoint
#   CLUSTER_ENDPOINT_RESOURCE  <- derived from SharedDb-ProxyArn + region/account
#   TENANT_NAME                <- Tenant.COMPANY_NAME
#   AWS_REGION
#   TENANT_TIER
# =========================================================================
resources:
  - ../../base
patchesStrategicMerge:
  - env-postgresql.yaml
